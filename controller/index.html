<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="apple-touch-icon" href="/controller/icons/icon-192.png">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="theme-color" content="#0a0f14">
  <title>PhantomPad Controller</title>
  <link rel="manifest" href="manifest.json">
  <link rel="stylesheet" href="css/controller.css">
</head>
<body>
  <!-- Settings Panel -->
  <div id="settings-overlay" class="settings-overlay hidden">
    <div class="settings-panel">
      <div class="settings-header">
        <div><h2>Controller settings</h2><span class="settings-caption">Tune the controls for this phone</span></div>
        <button id="close-settings" class="icon-btn">✕</button>
      </div>
      <div class="settings-body">
        <details class="setting-section" open>
          <summary><span>Controls</span><small>Feel, size and placement</small></summary>
        <div class="setting-group"><label>Vibration</label>
          <label class="toggle"><input type="checkbox" id="haptic-toggle" checked><span class="slider"></span></label>
        </div>
        <div class="setting-group"><label>Deadzone</label>
          <input type="range" id="deadzone-slider" min="0" max="50" value="15" class="range-slider">
          <span id="deadzone-value">0.15</span>
        </div>
        <div class="setting-group"><label>Controller Size</label>
          <input type="range" id="controller-scale-slider" min="70" max="115" value="100" class="range-slider">
          <span id="controller-scale-value">100%</span>
        </div>
        <div class="setting-group"><label>Stick Size</label>
          <input type="range" id="stick-size-slider" min="30" max="80" value="50" class="range-slider">
        </div>
        <div class="setting-group"><label>Controller Layout</label>
          <select id="controller-layout-select" class="select-input">
            <option value="standard">Standard</option>
            <option value="left-handed">Left-handed</option>
            <option value="compact">Compact</option>
          </select>
        </div>
        <div class="setting-group setting-actions">
          <button id="customize-controls-btn" class="action-btn">↔ Customize control positions</button>
        </div>
        <div class="setting-group setting-actions">
          <button id="reset-control-positions-btn" class="action-btn secondary-action">Reset control positions</button>
        </div>
        </details>
        <details class="setting-section">
          <summary><span>Appearance</span><small>Colors and button labels</small></summary>
        <div class="setting-group"><label>Theme</label>
          <div class="theme-options">
            <button class="theme-btn active" data-theme="phantom">Phantom</button>
            <button class="theme-btn" data-theme="neon">Neon</button>
            <button class="theme-btn" data-theme="crimson">Crimson</button>
            <button class="theme-btn" data-theme="emerald">Emerald</button>
          </div>
        </div>
        <div class="setting-group"><label>Button Layout</label>
          <select id="layout-select" class="select-input">
            <option value="xbox">Xbox (Default)</option>
            <option value="playstation">PlayStation Consoles</option>
            <option value="nintendo">Nintendo Switch</option>
          </select>
        </div>
        </details>
        <details class="setting-section">
          <summary><span>Game presets</span><small>Mappings and opacity</small></summary>
        <div class="setting-group preset-section">
          <label>Game Preset</label>
          <select id="preset-select" class="select-input">
            <optgroup label="General">
              <option value="default">Default</option>
              <option value="fps">FPS</option>
              <option value="racing">Racing</option>
              <option value="platformer">Platformer</option>
            </optgroup>
            <optgroup label="Emulators">
              <option value="ryujinx">Ryujinx</option>
              <option value="retroarch">RetroArch</option>
            </optgroup>
            <optgroup label="AAA Games">
              <option value="gtav">GTA V</option>
              <option value="eldenring">Elden Ring</option>
              <option value="minecraft">Minecraft</option>
              <option value="fortnite">Fortnite</option>
              <option value="rdr2">RDR2</option>
              <option value="witcher3">Witcher 3</option>
              <option value="cyberpunk">Cyberpunk 2077</option>
              <option value="forza">Forza Horizon 5</option>
              <option value="starfield">Starfield</option>
            </optgroup>
            <optgroup label="Gacha / Action RPG">
              <option value="genshin">Genshin Impact</option>
              <option value="starrail">Honkai Star Rail</option>
              <option value="wuwa">Wuthering Waves</option>
              <option value="tof">Tower of Fantasy</option>
            </optgroup>
          </select>
        </div>
        <div class="setting-group"><label>Opacity</label>
          <input type="range" id="opacity-slider" min="30" max="100" value="85" class="range-slider">
        </div>
        </details>
        <details class="setting-section">
          <summary><span>Motion controls</span><small>Gyroscope options</small></summary>
        <div class="setting-group"><label>Motion Controls</label>
          <select id="motion-select" class="select-input">
            <option value="off">Off</option>
            <option value="right">→ Right Stick</option>
            <option value="left">→ Left Stick</option>
            <option value="steering">🏎 Steering Wheel</option>
          </select>
        </div>
        <div class="setting-group"><label>Motion Sensitivity</label>
          <input type="range" id="motion-sens-slider" min="20" max="200" value="100" class="range-slider">
          <span id="motion-sens-value">1.0x</span>
        </div>
        <div class="setting-group">
          <button id="calibrate-btn" class="action-btn">📐 Calibrate Motion</button>
        </div>
        </details>
      </div>
    </div>
  </div>

  <!-- Main Controller -->
  <div id="controller" class="controller theme-phantom">

    <!-- Top Bar -->
    <div class="top-bar">
      <div class="bumper-trigger-group left">
        <button class="trigger-btn" id="lt" data-btn="lt" data-layout-id="lt">LT</button>
        <button class="bumper-btn" id="lb" data-btn="lb" data-layout-id="lb">LB</button>
      </div>
      <div class="status-bar">
        <div id="connection-indicator" class="conn-dot disconnected"></div>
        <span id="connection-text" class="conn-text">Disconnected</span>
        <span id="current-game-name" class="current-game-text"></span>
        <span class="player-badge" id="player-badge" style="display:none"><span class="player-num" id="player-num">P1</span></span>
        <span id="latency-display" class="latency-text neutral" aria-label="Phone to Windows server network round-trip time">Network RTT: --</span>
        <span id="motion-indicator" class="motion-ind hidden">📐</span>
        <button id="settings-btn" class="icon-btn" title="Settings">⚙</button>
        <button id="fullscreen-btn" class="icon-btn" title="Fullscreen">⛶</button>
      </div>
      <div class="bumper-trigger-group right">
        <button class="bumper-btn" id="rb" data-btn="rb" data-layout-id="rb">RB</button>
        <button class="trigger-btn" id="rt" data-btn="rt" data-layout-id="rt">RT</button>
      </div>
    </div>

    <!-- Main Play Area -->
    <div class="play-area">
      <div class="controller-deck-label" aria-hidden="true"><span>PHANTOMPAD</span><i></i><span>WIRELESS GAMEPAD</span></div>
      <div class="zone left-zone">
        <div class="joystick-container" id="left-stick-zone" data-layout-id="leftStick">
          <div class="joystick-base" id="left-stick-base">
            <div class="joystick-ring"></div>
            <div class="joystick-thumb" id="left-stick-thumb"></div>
          </div>
          <button class="stick-click-btn" data-btn="ls" data-layout-id="leftStickClick">L3</button>
        </div>
        <div class="dpad" id="dpad" data-layout-id="dpad">
          <button class="dpad-btn up" data-btn="dpadUp" data-layout-id="dpadUp"><span>▲</span></button>
          <button class="dpad-btn right" data-btn="dpadRight" data-layout-id="dpadRight"><span>►</span></button>
          <button class="dpad-btn down" data-btn="dpadDown" data-layout-id="dpadDown"><span>▼</span></button>
          <button class="dpad-btn left" data-btn="dpadLeft" data-layout-id="dpadLeft"><span>◄</span></button>
          <div class="dpad-center"></div>
        </div>
      </div>
      <div class="zone center-zone">
        <button class="center-btn" id="back" data-btn="back" data-layout-id="back">BACK</button>
        <button class="center-btn home-btn" id="home" data-btn="home" data-layout-id="home">⬡</button>
        <button class="center-btn" id="start" data-btn="start" data-layout-id="start">START</button>
      </div>
      <div class="zone right-zone">
        <div class="face-buttons" data-layout-id="faceButtons">
          <button class="face-btn y-btn" data-btn="Y" data-layout-id="faceY">Y</button>
          <button class="face-btn x-btn" data-btn="X" data-layout-id="faceX">X</button>
          <button class="face-btn b-btn" data-btn="B" data-layout-id="faceB">B</button>
          <button class="face-btn a-btn" data-btn="A" data-layout-id="faceA">A</button>
        </div>
        <div class="joystick-container" id="right-stick-zone" data-layout-id="rightStick">
          <div class="joystick-base" id="right-stick-base">
            <div class="joystick-ring"></div>
            <div class="joystick-thumb" id="right-stick-thumb"></div>
          </div>
          <button class="stick-click-btn" data-btn="rs" data-layout-id="rightStickClick">R3</button>
        </div>
      </div>
    </div>
    <div id="layout-edit-toolbar" class="layout-edit-toolbar hidden">
      <span>Drag controls to reposition</span>
      <button id="finish-layout-edit" class="action-btn">Done</button>
    </div>
  </div>

  <script src="js/socket.io.min.js"></script>
  <script src="js/utils.js"></script>
  <script src="js/controller.js"></script>
</body>
</html>
