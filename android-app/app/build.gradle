plugins {
    id 'com.android.application'
}

android {
    namespace 'com.phantompad.controller'
    compileSdk 35

    defaultConfig {
        applicationId "com.phantompad.controller"
        minSdk 24
        targetSdk 35
        versionCode 5
        versionName "1.6.1"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
        debug {
            debuggable true
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'androidx.core:core:1.12.0'
    implementation 'androidx.webkit:webkit:1.9.0'
    implementation 'com.google.android.material:material:1.11.0'
}

// Keep the Android controller UI in the APK while reusing the same source
// that the Windows app serves to browser clients.
tasks.register('syncControllerAssets', Sync) {
    from(rootProject.file('../controller'))
    into(file('src/main/assets/controller'))
}

tasks.named('preBuild').configure {
    dependsOn('syncControllerAssets')
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}
